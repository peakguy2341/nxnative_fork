name: Wonder IPA Diagnostics

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: xcode-27

    steps:
      - name: Download sample IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Wonder-Sample-Unsigned-IPA
          path: ./ipa-artifact
          repository: peakguy2341/nxnative_fork
          run-id: "42131294352"
          github-token: ${{ github.token }}

      - name: Inspect IPA
        shell: bash
        run: |
          set -e

          IPA=$(find ./ipa-artifact -name "*.ipa" | head -n 1)

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA not found"
            exit 1
          fi

          mkdir extracted
          unzip -q "$IPA" -d extracted

          APP=$(find extracted/Payload -maxdepth 1 -name "*.app" -type d | head -n 1)

          echo "=== APP METADATA ==="
          plutil -p "$APP/Info.plist"

          echo "=== EXECUTABLE ==="
          EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          file "$APP/$EXEC"

          echo "=== ARCHITECTURE ==="
          xcrun lipo -info "$APP/$EXEC" || true

          echo "=== SIGNATURE ==="
          codesign -dv "$APP" 2>&1 || true

          echo "=== PROVISIONING PROFILE ==="
          if [ -f "$APP/embedded.mobileprovision" ]; then
            echo "Profile exists"
          else
            echo "No embedded profile"
          fi

          echo "=== DIAGNOSTICS COMPLETE ==="
