# setup
name: Build NSMBUDX IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Toolchains
        run: |
          brew install xcodegen
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Auto-Download Game File
        run: |
          curl -L -o ./roms/nsmbudx.nsp 'https://archive.org'

      - name: Build Game Binary
        run: |
          python3 build.py --game ./roms/nsmbudx.nsp --keys ./roms/prod.keys --platform ios --out ./build/nsmbudx.ipa

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: NSMBUDX-Native-IPA
          path: build/nsmbudx.ipa
