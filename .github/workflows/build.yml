name: Wonder Mobile - nxnative Build Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check Wonder Mobile Build Environment
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show build environment
        run: |
          echo "=== SYSTEM ==="
          uname -a

          echo ""
          echo "=== XCODE ==="
          xcodebuild -version

          echo ""
          echo "=== SWIFT ==="
          swift --version

          echo ""
          echo "=== PYTHON ==="
          python3 --version

          echo ""
          echo "=== GIT ==="
          git --version

      - name: Check required tools
        run: |
          set -e

          echo "=== TOOL CHECK ==="

          command -v xcodebuild
          command -v swift
          command -v python3
          command -v bash

          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen version
          else
            echo "XcodeGen is not installed."
          fi

      - name: Check nxnative project files
        run: |
          set -e

          echo "=== PROJECT FILE CHECK ==="

          FILES=(
            "dm/ios/project.yml"
            "dm/ios/tools/build_ipa.sh"
          )

          for FILE in "${FILES[@]}"; do
            if [ -f "$FILE" ]; then
              echo "FOUND: $FILE"
            else
              echo "MISSING: $FILE"
              exit 1
            fi
          done

      - name: Validate build script syntax
        run: |
          set -e

          echo "=== BASH SYNTAX CHECK ==="

          bash -n dm/ios/tools/build_ipa.sh

          echo "build_ipa.sh syntax is valid."

      - name: Inspect Xcode project configuration
        run: |
          set -e

          echo "=== PROJECT CONFIGURATION ==="

          grep -nE \
            '^(name:|options:|targets:|schemes:|configFiles:)' \
            dm/ios/project.yml || true

      - name: Inspect build script requirements
        run: |
          set -e

          echo "=== BUILD SCRIPT REQUIREMENTS ==="

          grep -nE \
            'GAME|PATCHED|ROMFS|MSL_IOS|DM_XCODE_PROJECT_DIR|prepare-xcode' \
            dm/ios/tools/build_ipa.sh || true

      - name: Final report
        run: |
          echo ""
          echo "=================================="
          echo " WONDER MOBILE BUILD CHECKS DONE"
          echo "=================================="
          echo ""
          echo "Repository checks completed."
          echo "Build script syntax checked."
          echo "No game data was processed."
          echo "No IPA was generated."
