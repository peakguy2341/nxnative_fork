name: nxnative iOS Source Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-source-build:
    name: Build nxnative iOS Source
    runs-on: xcode-27
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source files
        run: |
          set -euo pipefail
          test -f dm/ios/tools/build_smoke.py
          test -f dm/ios/project.yml
          echo "nxnative source files verified."

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic

      - name: Download Metal Toolchain
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain

      - name: Build actual nxnative iOS source
        env:
          GAME: "010015100B514000"
        run: |
          set -euo pipefail

          OUTPUT="$RUNNER_TEMP/nxnative-ios-smoke"

          if [ -e "$OUTPUT" ]; then
            echo "Removing previous temporary output."
            rm -rf "$OUTPUT"
          fi

          GAME="$GAME" python3 dm/ios/tools/build_smoke.py \
            --output "$OUTPUT" \
            2>&1 | tee "$RUNNER_TEMP/nxnative-build.log"

          echo "Source smoke build completed."

      - name: Upload build output and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-ios-source-build
          path: |
            ${{ runner.temp }}/nxnative-ios-smoke/
            ${{ runner.temp }}/nxnative-build.log
          if-no-files-found: warn
          retention-days: 7
