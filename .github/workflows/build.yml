# setup
name: Build SMBW IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # Switched to 3.12 to meet the script's requirement

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install System Utilities
        run: |
          sudo apt-get update && sudo apt-get install -y zstd glslang-tools

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz backports.zstd

      - name: Auto-Download Game File
        run: |
          mkdir -p roms
          curl -L -o "./roms/Super Mario Bros. Wonder [010015100E50E000][v0].nsp" 'https://archive.org'

      - name: Configure System Keys
        run: |
          mkdir -p ~/.switch
          cp ./roms/prod.keys ~/.switch/PROD.KEYS || true
          cp ./roms/prod.keys ./roms/PROD.KEYS || true

      - name: Build Game Binary
        run: |
          python3 scripts/build_ipa_from_nsp.py ./roms --survey-only

      - name: Upload Finished Project
        uses: actions/upload-artifact@v4
        with:
          name: SMBW-Native-Output
          path: roms/*_survey/
