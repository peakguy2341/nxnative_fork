# setup
name: Super Mario Bros. Wonder - Wonder Mobile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare Wonder Mobile Build
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout nxnative
        uses: actions/checkout@v4

      - name: Check Mac architecture
        run: |
          set -e

          echo "Checking Mac architecture..."

          ARCH=$(uname -m)
          echo "Architecture: $ARCH"

          if [ "$ARCH" != "arm64" ]; then
            echo "ERROR: nxnative requires an Apple Silicon Mac."
            exit 1
          fi

      - name: Check macOS version
        run: |
          set -e

          sw_vers

          VERSION=$(sw_vers -productVersion)

          if [ "$(printf '%s\n' 26.6 "$VERSION" | sort -V | head -n 1)" != "26.6" ]; then
            echo "ERROR: macOS 26.6 or later is required."
            exit 1
          fi

      - name: Select Xcode 27.2
        run: |
          set -e

          XCODE=""

          for APP in \
            /Applications/Xcode-27.2.app \
            /Applications/Xcode.app; do

            if [ -d "$APP" ]; then
              VERSION=$("$APP/Contents/Developer/usr/bin/xcodebuild" -version | awk '/Xcode/ {print $2}')

              if [ "$VERSION" = "27.2" ]; then
                XCODE="$APP"
                break
              fi
            fi
          done

          if [ -z "$XCODE" ]; then
            echo "ERROR: Xcode 27.2 was not found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"

          xcodebuild -version

      - name: Install Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Install Homebrew dependencies
        run: |
          set -e

          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          set -e

          python3 -m venv .venv
          source .venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            lz4 \
            "capstone>=5,<6" \
            fonttools \
            nsz \
            zbic \
            "backports.zstd; python_version < '3.14'"

      - name: Verify dependencies
        run: |
          set -e

          source .venv/bin/activate

          python --version
          python -m pip --version
          xcodebuild -version
          xcodegen --version
          zstd --version
          glslangValidator --version
          dotnet --version

      - name: Verify nxnative packing script
        run: |
          set -e

          test -f scripts/build_ipa_from_nsp.py

          source .venv/bin/activate

          python scripts/build_ipa_from_nsp.py --help

          echo "NXNATIVE SCRIPT CHECK PASSED"

      - name: Create build report
        if: always()
        run: |
          {
            echo "Wonder Mobile Build Report"
            echo "-------------------------"
            sw_vers || true
            uname -m || true
            xcodebuild -version || true
            python3 --version || true
            dotnet --version || true
          } > wonder-mobile-report.txt

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-Build-Report
          path: wonder-mobile-report.txt
          if-no-files-found: ignore
          retention-days: 7
