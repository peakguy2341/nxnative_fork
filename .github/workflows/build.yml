name: Wonder Mobile - nxnative Project Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare nxnative project
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout nxnative fork
        uses: actions/checkout@v4
        with:
          repository: peakguy2341/nxnative_fork
          fetch-depth: 0

      - name: Check environment
        run: |
          set -e
          sw_vers
          xcodebuild -version
          python3 --version
          uname -m

      - name: Install build dependencies
        run: |
          set -e
          brew update
          brew install xcodegen zstd glslang

      - name: Install Python tools
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect repository build instructions
        run: |
          set -e
          echo "=== BUILD DOCUMENTATION ==="
          find . -maxdepth 3 \
            \( -iname 'readme*' -o -iname 'makefile' \
            -o -iname '*.sh' -o -iname '*.yml' \
            -o -iname '*.yaml' \) -print

          echo "=== DM IOS DIRECTORY ==="
          find dm/ios -maxdepth 2 -type f -print || true

          echo "=== GENERATION DIRECTORY ==="
          if [ -d dm/ios/Gen ]; then
            find dm/ios/Gen -maxdepth 2 -print
          else
            echo "Gen directory does not exist."
          fi

      - name: Validate generated project prerequisites
        run: |
          set -e
          cd dm/ios

          REQUIRED=(
            "Gen/dm.xcconfig"
            "Gen/embed.S"
            "Gen/Assets.xcassets"
            "Gen/src"
            "Gen/main/main.c"
          )

          MISSING=0

          for item in "${REQUIRED[@]}"; do
            if [ ! -e "$item" ]; then
              echo "::warning::Missing generated prerequisite: $item"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo ""
            echo "Project generation requires nxnative's documented"
            echo "preparation process to have produced the Gen files."
            echo "Stopping before XcodeGen to avoid a misleading failure."
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          set -e
          cd dm/ios
          xcodegen generate

      - name: Validate Xcode project
        run: |
          set -e
          cd dm/ios
          xcodebuild -list

      - name: Upload project files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nxnative-project-diagnostics
          path: |
            dm/ios/project.yml
            dm/ios/Gen/
          if-no-files-found: ignore
          retention-days: 3
