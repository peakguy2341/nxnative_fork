# setup
name: Build SMBW IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Tools
        run: |
          brew install xcodegen zstd glslang uv
          brew install --cask dotnet-sdk

      - name: Auto-Download Game File
        run: |
          mkdir -p roms
          curl -L -o ./roms/smbw.nsp 'https://archive.org'

      - name: Build Game Binary
        run: |
          uv run scripts/build_ipa_from_nsp.py ./roms -k ./roms/prod.keys

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: SMBW-Native-IPA
          path: roms/*_build/
