# setup
name: Build NSMBUDX IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install iOS SDK Component
        run: |
          sudo xcodebuild -downloadComponent iOS
          sudo xcodebuild -downloadComponent MetalToolchain

      - name: Install Toolchains
        run: |
          brew install xcodegen zstd glslang
          brew install --cask dotnet-sdk

      - name: Install Dependencies
        run: |
          pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd

      - name: Auto-Download Game File
        run: |
          mkdir -p roms
          curl -L -o ./roms/nsmbudx.nsp 'https://archive.org'

      - name: Build Game Binary
        run: |
          python3 scripts/build_ipa_from_nsp.py ./roms -k ./roms/prod.keys

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: NSMBUDX-Native-IPA
          path: ./*_build/
