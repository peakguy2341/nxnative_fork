# setup
name: Build SMBW IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: ubuntu-latest  # Switched to the 100% FREE Linux cloud runners
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd glslang-tools dotnet-sdk-8.0

      - name: Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install lz4 "capstone>=5,<6" fonttools nsz backports.zstd

      - name: Auto-Download Game File
        run: |
          mkdir -p roms
          curl -L -o "./roms/Super Mario Bros. Wonder [010015100E50E000][v0].nsp" 'https://archive.org'

      - name: Configure System Keys
        run: |
          mkdir -p ~/.switch
          cp ./roms/prod.keys ~/.switch/PROD.KEYS
          cp ./roms/prod.keys ./roms/PROD.KEYS

      - name: Build Game Binary
        run: |
          python3 scripts/build_ipa_from_nsp.py ./roms --survey-only

      - name: Upload Finished Project
        uses: actions/upload-artifact@v4
        with:
          name: SMBW-Native-Output
          path: roms/*_survey/
