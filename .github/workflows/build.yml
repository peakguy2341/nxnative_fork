# setup
name: Build NSMBUDX IPA
on: [workflow_dispatch]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Adds the exact compiler environment the tool needs

      - name: Install Tools & Dependencies
        run: |
          brew install xcodegen zstd glslang
          pip install lz4 "capstone>=5,<6" fonttools nsz zbic backports.zstd

      - name: Auto-Download Game File
        run: |
          mkdir -p roms
          curl -L -o ./roms/nsmbudx.nsp 'https://archive.org'

      - name: Build Game Binary
        run: |
          python3 scripts/build_ipa_from_nsp.py ./roms -k ./roms/prod.keys

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: NSMBUDX-Native-IPA
          path: ./*_build/
