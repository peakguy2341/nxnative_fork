name: Wonder Mobile V2 - Play UI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wonder Mobile IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          set -e
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project folders
        run: |
          mkdir -p Wonder
          mkdir -p package/Payload

      - name: Create Xcode project
        run: |
          cat > project.yml <<'YAML'
          name: Wonder

          options:
            bundleIdPrefix: com.peakguy2341
            deploymentTarget:
              iOS: "18.0"

          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: "18.0"

          targets:
            Wonder:
              type: application
              platform: iOS
              sources:
                - Wonder
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.peakguy2341.wonder
                  PRODUCT_NAME: Wonder
                  INFOPLIST_KEY_CFBundleDisplayName: Wonder
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGN_STYLE: Manual
          YAML

          xcodegen generate

      - name: Create Wonder source files
        run: |
          cat > Wonder/WonderApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct WonderApp: App {
              init() {
                  FolderManager.shared.createFolders()
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFT

          cat > Wonder/FolderManager.swift <<'SWIFT'
          import Foundation

          final class FolderManager {
              static let shared = FolderManager()

              let folderNames = ["roms", "update", "firm"]

              var documents: URL {
                  FileManager.default.urls(
                      for: .documentDirectory,
                      in: .userDomainMask
                  )[0]
              }

              func createFolders() {
                  for name in folderNames {
                      let url = documents.appendingPathComponent(
                          name,
                          isDirectory: true
                      )

                      do {
                          try FileManager.default.createDirectory(
                              at: url,
                              withIntermediateDirectories: true
                          )
                      } catch {
                          print("Folder creation failed: \(error)")
                      }
                  }
              }

              func folderExists(_ name: String) -> Bool {
                  var isDirectory: ObjCBool = false
                  let path = documents
                      .appendingPathComponent(name)
                      .path

                  return FileManager.default.fileExists(
                      atPath: path,
                      isDirectory: &isDirectory
                  ) && isDirectory.boolValue
              }

              func fileCount(_ name: String) -> Int {
                  let url = documents.appendingPathComponent(name)

                  return (try? FileManager.default.contentsOfDirectory(
                      at: url,
                      includingPropertiesForKeys: nil,
                      options: [.skipsHiddenFiles]
                  ).count) ?? 0
              }

              func allFoldersExist() -> Bool {
                  folderNames.allSatisfy { folderExists($0) }
              }
          }
          SWIFT

          cat > Wonder/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct ContentView: View {
              @State private var status = "Ready"
              @State private var showStatus = false

              private let purple = Color(
                  red: 0.48,
                  green: 0.32,
                  blue: 0.92
              )

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.07, green: 0.04, blue: 0.16),
                              Color(red: 0.19, green: 0.10, blue: 0.39),
                              Color(red: 0.06, green: 0.05, blue: 0.16)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      Circle()
                          .fill(purple.opacity(0.3))
                          .frame(width: 300, height: 300)
                          .blur(radius: 100)
                          .offset(x: 130, y: -250)

                      VStack(spacing: 25) {
                          header

                          Spacer()

                          Image(systemName: "sparkles")
                              .font(.system(size: 90, weight: .light))
                              .foregroundStyle(.white)
                              .shadow(color: purple, radius: 30)

                          Text("SUPER MARIO BROS. WONDER")
                              .font(.system(size: 22, weight: .bold))
                              .tracking(-0.5)
                              .multilineTextAlignment(.center)

                          Text("Your adventure starts here.")
                              .foregroundStyle(.white.opacity(0.65))

                          Button {
                              checkGameSetup()
                          } label: {
                              HStack {
                                  Image(systemName: "play.fill")
                                  Text("PLAY")
                                      .tracking(3)
                              }
                              .font(.system(size: 17, weight: .bold))
                              .frame(maxWidth: .infinity)
                              .padding(19)
                              .background(
                                  purple.gradient,
                                  in: RoundedRectangle(cornerRadius: 20)
                              )
                          }
                          .buttonStyle(.plain)

                          if showStatus {
                              Text(status)
                                  .font(.system(size: 13))
                                  .foregroundStyle(.white.opacity(0.8))
                                  .multilineTextAlignment(.center)
                                  .padding(.horizontal, 12)
                          }

                          Spacer()

                          glassCard {
                              VStack(alignment: .leading, spacing: 15) {
                                  Label(
                                      "WONDER STORAGE",
                                      systemImage: "folder"
                                  )
                                  .font(.system(size: 11, weight: .bold))
                                  .tracking(2)
                                  .foregroundStyle(.white.opacity(0.65))

                                  folderRow("roms")
                                  folderRow("update")
                                  folderRow("firm")

                                  Text("Files → On My iPad → Wonder")
                                      .font(.system(size: 12))
                                      .foregroundStyle(.white.opacity(0.5))
                              }
                          }
                      }
                      .padding(.horizontal, 24)
                      .padding(.top, 20)
                      .padding(.bottom, 20)
                  }
                  .onAppear {
                      FolderManager.shared.createFolders()
                  }
              }

              private var header: some View {
                  HStack {
                      Text("WONDER")
                          .font(.system(size: 13, weight: .bold))
                          .tracking(4)
                          .foregroundStyle(.white.opacity(0.7))

                      Spacer()

                      Image(systemName: "sparkles")
                  }
              }

              private func folderRow(_ name: String) -> some View {
                  HStack {
                      Image(systemName: "folder.fill")
                          .foregroundStyle(.yellow)

                      Text(name)

                      Spacer()

                      Text(
                          "\(FolderManager.shared.fileCount(name)) items"
                      )
                      .foregroundStyle(.white.opacity(0.55))
                  }
                  .font(.system(size: 14, weight: .medium))
              }

              private func checkGameSetup() {
                  FolderManager.shared.createFolders()

                  if !FolderManager.shared.allFoldersExist() {
                      status = "Some Wonder folders are missing."
                  } else {
                      status = "Storage is ready. A compatible game runtime is not connected yet."
                  }

                  showStatus = true
              }

              @ViewBuilder
              private func glassCard<Content: View>(
                  @ViewBuilder content: () -> Content
              ) -> some View {
                  let shape = RoundedRectangle(cornerRadius: 25)

                  if #available(iOS 26.0, *) {
                      content()
                          .padding(20)
                          .background {
                              shape.fill(.white.opacity(0.06))
                          }
                          .glassEffect(.regular, in: shape)
                          .overlay {
                              shape.stroke(
                                  .white.opacity(0.15),
                                  lineWidth: 1
                              )
                          }
                  } else {
                      content()
                          .padding(20)
                          .background(.ultraThinMaterial, in: shape)
                          .overlay {
                              shape.stroke(
                                  .white.opacity(0.15),
                                  lineWidth: 1
                              )
                          }
                  }
              }
          }
          SWIFT

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate
          xcodebuild -list -project Wonder.xcodeproj

      - name: Build Wonder
        run: |
          set -e
          xcodebuild \
            -project Wonder.xcodeproj \
            -scheme Wonder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Configure Files sharing
        run: |
          set -e
          APP="build/Build/Products/Release-iphoneos/Wonder.app"
          INFO="$APP/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" "$INFO" \
            || /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" "$INFO"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" "$INFO" \
            || /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$INFO"

      - name: Package IPA
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/Wonder.app"

          test -d "$APP"
          test -f "$APP/Info.plist"

          mkdir -p package/Payload
          cp -R "$APP" package/Payload/Wonder.app

          cd package
          zip -qry ../Wonder-Mobile-V2.ipa Payload
          cd ..

          test -s Wonder-Mobile-V2.ipa
          unzip -l Wonder-Mobile-V2.ipa

      - name: Upload Wonder IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V2-IPA
          path: Wonder-Mobile-V2.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V2-Build-Report
          path: |
            project.yml
            Wonder/
          if-no-files-found: ignore
          retention-days: 7
