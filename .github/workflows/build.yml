name: Wonder Mobile V1 - Liquid Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wonder Mobile IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          set -e
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -e
          brew install xcodegen

      - name: Create project folders
        run: |
          set -e
          mkdir -p Wonder/Assets.xcassets
          mkdir -p package/Payload

      - name: Create Xcode project configuration
        run: |
          cat > project.yml <<'YAML'
          name: Wonder

          options:
            bundleIdPrefix: com.peakguy2341
            deploymentTarget:
              iOS: "18.0"

          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: "18.0"

          targets:
            Wonder:
              type: application
              platform: iOS
              sources:
                - Wonder
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.peakguy2341.wonder
                  PRODUCT_NAME: Wonder
                  INFOPLIST_KEY_CFBundleDisplayName: Wonder
                  GENERATE_INFOPLIST_FILE: YES
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGN_STYLE: Manual
          YAML

          xcodegen generate

      - name: Create Wonder app
        run: |
          cat > Wonder/WonderApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct WonderApp: App {
              init() {
                  FolderManager.shared.createFolders()
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFT

          cat > Wonder/FolderManager.swift <<'SWIFT'
          import Foundation

          final class FolderManager: ObservableObject {
              static let shared = FolderManager()

              @Published var refreshID = UUID()

              let folderNames = ["roms", "update", "firm"]

              var wonderDirectory: URL {
                  FileManager.default.urls(
                      for: .documentDirectory,
                      in: .userDomainMask
                  )[0]
              }

              func createFolders() {
                  for name in folderNames {
                      let folder = wonderDirectory.appendingPathComponent(
                          name,
                          isDirectory: true
                      )

                      do {
                          try FileManager.default.createDirectory(
                              at: folder,
                              withIntermediateDirectories: true
                          )
                      } catch {
                          print("Could not create \(name): \(error)")
                      }
                  }

                  refreshID = UUID()
              }

              func files(in folderName: String) -> [URL] {
                  let folder = wonderDirectory.appendingPathComponent(
                      folderName,
                      isDirectory: true
                  )

                  return (try? FileManager.default.contentsOfDirectory(
                      at: folder,
                      includingPropertiesForKeys: [.isDirectoryKey],
                      options: [.skipsHiddenFiles]
                  )) ?? []
              }

              func fileCount(in folderName: String) -> Int {
                  files(in: folderName).count
              }

              func folderURL(_ name: String) -> URL {
                  wonderDirectory.appendingPathComponent(
                      name,
                      isDirectory: true
                  )
              }
          }
          SWIFT

          cat > Wonder/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct ContentView: View {
              @ObservedObject private var folders = FolderManager.shared
              @State private var selectedFolder: String?

              private let purple = Color(
                  red: 0.48,
                  green: 0.32,
                  blue: 0.92
              )

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.08, green: 0.05, blue: 0.18),
                              Color(red: 0.16, green: 0.09, blue: 0.34),
                              Color(red: 0.07, green: 0.06, blue: 0.17)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      Circle()
                          .fill(purple.opacity(0.25))
                          .frame(width: 280, height: 280)
                          .blur(radius: 90)
                          .offset(x: 130, y: -260)

                      if let folder = selectedFolder {
                          folderScreen(folder)
                      } else {
                          homeScreen
                      }
                  }
                  .foregroundStyle(.white)
                  .animation(.spring(response: 0.4), value: selectedFolder)
              }

              private var homeScreen: some View {
                  VStack(spacing: 25) {
                      header

                      Spacer()

                      Image(systemName: "sparkles")
                          .font(.system(size: 95, weight: .light))
                          .foregroundStyle(.white)
                          .shadow(color: purple, radius: 30)

                      Text("Welcome to Wonder")
                          .font(.system(size: 31, weight: .bold))
                          .tracking(-1)

                      Text("Your adventure starts here.")
                          .foregroundStyle(.white.opacity(0.65))

                      Spacer()

                      glassCard {
                          VStack(alignment: .leading, spacing: 17) {
                              Label(
                                  "YOUR WONDER SPACE",
                                  systemImage: "square.grid.2x2"
                              )
                              .font(.system(size: 11, weight: .bold))
                              .tracking(2)
                              .foregroundStyle(.white.opacity(0.65))

                              Text("Your files, organized.")
                                  .font(.system(size: 21, weight: .semibold))

                              Text("Browse your Wonder folders stored on this iPad.")
                                  .font(.system(size: 14))
                                  .foregroundStyle(.white.opacity(0.65))

                              Button {
                                  folders.createFolders()
                                  selectedFolder = "overview"
                              } label: {
                                  HStack {
                                      Text("Open Wonder Library")
                                      Spacer()
                                      Image(systemName: "arrow.right")
                                  }
                                  .font(.system(size: 16, weight: .semibold))
                                  .padding(17)
                                  .background(
                                      purple.gradient,
                                      in: RoundedRectangle(cornerRadius: 18)
                                  )
                              }
                              .buttonStyle(.plain)
                          }
                      }
                      .padding(.horizontal, 22)
                      .padding(.bottom, 25)
                  }
                  .padding(.horizontal, 22)
              }

              private var header: some View {
                  HStack {
                      Text("WONDER")
                          .font(.system(size: 13, weight: .bold))
                          .tracking(4)
                          .foregroundStyle(.white.opacity(0.7))

                      Spacer()

                      Image(systemName: "sparkles")
                          .font(.system(size: 20))
                  }
                  .padding(.top, 18)
              }

              private func folderScreen(_ folder: String) -> some View {
                  VStack(spacing: 22) {
                      HStack {
                          Button {
                              selectedFolder = nil
                          } label: {
                              Image(systemName: "chevron.left")
                                  .padding(12)
                                  .background(.white.opacity(0.1), in: Circle())
                          }
                          .buttonStyle(.plain)

                          Spacer()

                          Text(folder == "overview" ? "LIBRARY" : folder.uppercased())
                              .font(.system(size: 12, weight: .bold))
                              .tracking(3)

                          Spacer()

                          Button {
                              folders.createFolders()
                          } label: {
                              Image(systemName: "arrow.clockwise")
                                  .padding(12)
                                  .background(.white.opacity(0.1), in: Circle())
                          }
                          .buttonStyle(.plain)
                      }

                      if folder == "overview" {
                          ScrollView {
                              VStack(spacing: 14) {
                                  ForEach(folders.folderNames, id: \.self) { name in
                                      Button {
                                          selectedFolder = name
                                      } label: {
                                          glassCard {
                                              HStack(spacing: 15) {
                                                  Image(systemName: "folder.fill")
                                                      .font(.system(size: 29))
                                                      .foregroundStyle(.yellow)

                                                  VStack(alignment: .leading, spacing: 5) {
                                                      Text(name)
                                                          .font(.system(size: 18, weight: .semibold))

                                                      Text("\(folders.fileCount(in: name)) items")
                                                          .font(.system(size: 13))
                                                          .foregroundStyle(.white.opacity(0.6))
                                                  }

                                                  Spacer()

                                                  Image(systemName: "chevron.right")
                                                      .foregroundStyle(.white.opacity(0.5))
                                              }
                                          }
                                      }
                                      .buttonStyle(.plain)
                                  }
                              }
                          }

                          Text("Files → On My iPad → Wonder")
                              .font(.system(size: 12))
                              .foregroundStyle(.white.opacity(0.5))
                      } else {
                          let items = folders.files(in: folder)

                          if items.isEmpty {
                              Spacer()

                              Image(systemName: "folder")
                                  .font(.system(size: 55, weight: .light))
                                  .foregroundStyle(.white.opacity(0.55))

                              Text("This folder is empty")
                                  .font(.system(size: 20, weight: .semibold))

                              Text("Files you add to this folder will appear here.")
                                  .font(.system(size: 13))
                                  .foregroundStyle(.white.opacity(0.55))
                                  .multilineTextAlignment(.center)

                              Spacer()
                          } else {
                              List(items, id: \.absoluteString) { item in
                                  HStack {
                                      Image(systemName: "doc")
                                      Text(item.lastPathComponent)
                                          .lineLimit(1)
                                  }
                                  .listRowBackground(Color.clear)
                                  .foregroundStyle(.white)
                              }
                              .scrollContentBackground(.hidden)
                          }
                      }

                      Spacer(minLength: 0)
                  }
                  .padding(.horizontal, 22)
                  .padding(.top, 18)
              }

              @ViewBuilder
              private func glassCard<Content: View>(
                  @ViewBuilder content: () -> Content
              ) -> some View {
                  let shape = RoundedRectangle(cornerRadius: 25)

                  if #available(iOS 26.0, *) {
                      content()
                          .padding(20)
                          .background {
                              shape.fill(.white.opacity(0.06))
                          }
                          .glassEffect(.regular, in: shape)
                          .overlay {
                              shape.stroke(.white.opacity(0.15), lineWidth: 1)
                          }
                  } else {
                      content()
                          .padding(20)
                          .background(.ultraThinMaterial, in: shape)
                          .overlay {
                              shape.stroke(.white.opacity(0.15), lineWidth: 1)
                          }
                  }
              }
          }
          SWIFT

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate
          xcodebuild -list -project Wonder.xcodeproj

      - name: Build Wonder for iOS
        run: |
          set -e

          xcodebuild \
            -project Wonder.xcodeproj \
            -scheme Wonder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package standard iOS IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Wonder.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Wonder.app was not created."
            exit 1
          fi

          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/Wonder.app

          test -f package/Payload/Wonder.app/Info.plist

          cd package
          /usr/bin/zip -qry ../Wonder-Mobile-V1.ipa Payload
          cd ..

          echo "IPA contents:"
          unzip -l Wonder-Mobile-V1.ipa

          test -s Wonder-Mobile-V1.ipa

      - name: Upload Wonder IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V1-IPA
          path: Wonder-Mobile-V1.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V1-Build-Report
          path: |
            project.yml
            Wonder/
          if-no-files-found: ignore
          retention-days: 7
