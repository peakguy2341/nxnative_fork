name: Wonder Mobile V1 - Liquid Glass

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wonder Mobile IPA
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check build environment
        run: |
          set -e
          sw_vers
          uname -m
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -e
          brew install xcodegen

      - name: Create project folders
        run: |
          set -e
          mkdir -p Wonder
          mkdir -p package/Payload

      - name: Create Xcode project configuration
        run: |
          cat > project.yml <<'YAML'
          name: Wonder

          options:
            bundleIdPrefix: com.peakguy2341
            deploymentTarget:
              iOS: "18.0"

          settings:
            base:
              SWIFT_VERSION: 5.0
              IPHONEOS_DEPLOYMENT_TARGET: "18.0"

          targets:
            Wonder:
              type: application
              platform: iOS
              sources:
                - Wonder
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.peakguy2341.wonder
                  PRODUCT_NAME: Wonder
                  INFOPLIST_KEY_CFBundleDisplayName: Wonder
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_UIFileSharingEnabled: YES
                  INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SUPPORTS_MACCATALYST: NO
                  CODE_SIGN_STYLE: Manual
          YAML

          xcodegen generate

      - name: Create Wonder app
        run: |
          cat > Wonder/WonderApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct WonderApp: App {
              init() {
                  FolderManager.shared.createFolders()
              }

              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          SWIFT

          cat > Wonder/FolderManager.swift <<'SWIFT'
          import Foundation

          final class FolderManager {
              static let shared = FolderManager()

              private let folderNames = [
                  "roms",
                  "update",
                  "firm"
              ]

              func createFolders() {
                  let documents = FileManager.default.urls(
                      for: .documentDirectory,
                      in: .userDomainMask
                  )[0]

                  for name in folderNames {
                      let folder = documents.appendingPathComponent(
                          name,
                          isDirectory: true
                      )

                      do {
                          try FileManager.default.createDirectory(
                              at: folder,
                              withIntermediateDirectories: true
                          )

                          print("Wonder folder ready: \(name)")
                      } catch {
                          print(
                              "Could not create \(name): \(error)"
                          )
                      }
                  }
              }
          }
          SWIFT

          cat > Wonder/ContentView.swift <<'SWIFT'
          import SwiftUI

          struct ContentView: View {
              private let purple = Color(
                  red: 0.48,
                  green: 0.32,
                  blue: 0.92
              )

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.08, green: 0.05, blue: 0.18),
                              Color(red: 0.16, green: 0.09, blue: 0.34),
                              Color(red: 0.07, green: 0.06, blue: 0.17)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      Circle()
                          .fill(purple.opacity(0.25))
                          .frame(width: 280, height: 280)
                          .blur(radius: 90)
                          .offset(x: 130, y: -260)

                      VStack(spacing: 25) {
                          HStack {
                              Text("WONDER")
                                  .font(.system(size: 13, weight: .bold))
                                  .tracking(4)
                                  .foregroundStyle(.white.opacity(0.7))

                              Spacer()

                              Image(systemName: "sparkles")
                                  .font(.system(size: 20))
                          }
                          .padding(.top, 18)

                          Spacer()

                          Image(systemName: "sparkles")
                              .font(.system(size: 95, weight: .light))
                              .foregroundStyle(.white)
                              .shadow(color: purple, radius: 30)

                          Text("Welcome to Wonder")
                              .font(.system(size: 31, weight: .bold))
                              .tracking(-1)

                          Text("Your adventure starts here.")
                              .foregroundStyle(.white.opacity(0.65))

                          Spacer()

                          glassCard {
                              VStack(alignment: .leading, spacing: 15) {
                                  Label(
                                      "WONDER STORAGE",
                                      systemImage: "folder"
                                  )
                                  .font(.system(size: 11, weight: .bold))
                                  .tracking(2)
                                  .foregroundStyle(.white.opacity(0.65))

                                  Text("Your Wonder folders are ready.")
                                      .font(.system(size: 21, weight: .semibold))

                                  Text(
                                      "Find your folders in Files → On My iPad → Wonder."
                                  )
                                  .font(.system(size: 14))
                                  .foregroundStyle(.white.opacity(0.65))

                                  HStack(spacing: 10) {
                                      Image(systemName: "folder.fill")
                                          .foregroundStyle(.yellow)

                                      Text("roms")
                                      Spacer()

                                      Image(systemName: "folder.fill")
                                          .foregroundStyle(.yellow)

                                      Text("update")
                                  }
                                  .font(.system(size: 13, weight: .medium))

                                  HStack(spacing: 10) {
                                      Image(systemName: "folder.fill")
                                          .foregroundStyle(.yellow)

                                      Text("firm")
                                  }
                                  .font(.system(size: 13, weight: .medium))
                              }
                          }
                          .padding(.horizontal, 22)
                          .padding(.bottom, 25)
                      }
                      .padding(.horizontal, 22)
                  }
              }

              @ViewBuilder
              private func glassCard<Content: View>(
                  @ViewBuilder content: () -> Content
              ) -> some View {
                  let shape = RoundedRectangle(cornerRadius: 25)

                  if #available(iOS 26.0, *) {
                      content()
                          .padding(20)
                          .background {
                              shape.fill(.white.opacity(0.06))
                          }
                          .glassEffect(.regular, in: shape)
                          .overlay {
                              shape.stroke(
                                  .white.opacity(0.15),
                                  lineWidth: 1
                              )
                          }
                  } else {
                      content()
                          .padding(20)
                          .background(
                              .ultraThinMaterial,
                              in: shape
                          )
                          .overlay {
                              shape.stroke(
                                  .white.opacity(0.15),
                                  lineWidth: 1
                              )
                          }
                  }
              }
          }
          SWIFT

      - name: Generate Xcode project
        run: |
          set -e
          xcodegen generate
          xcodebuild -list -project Wonder.xcodeproj

      - name: Build Wonder for iOS
        run: |
          set -e

          xcodebuild \
            -project Wonder.xcodeproj \
            -scheme Wonder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Configure Files app sharing
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Wonder.app"
          INFO="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Set :UIFileSharingEnabled true" "$INFO" \
            || /usr/libexec/PlistBuddy \
            -c "Add :UIFileSharingEnabled bool true" "$INFO"

          /usr/libexec/PlistBuddy \
            -c "Set :LSSupportsOpeningDocumentsInPlace true" "$INFO" \
            || /usr/libexec/PlistBuddy \
            -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$INFO"

          echo "=== FILE SHARING SETTINGS ==="
          /usr/libexec/PlistBuddy \
            -c "Print :UIFileSharingEnabled" "$INFO"

          /usr/libexec/PlistBuddy \
            -c "Print :LSSupportsOpeningDocumentsInPlace" "$INFO"

      - name: Package standard iOS IPA
        run: |
          set -e

          APP_PATH="build/Build/Products/Release-iphoneos/Wonder.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Wonder.app was not created."
            exit 1
          fi

          mkdir -p package/Payload
          cp -R "$APP_PATH" package/Payload/Wonder.app

          test -f package/Payload/Wonder.app/Info.plist

          cd package
          /usr/bin/zip -qry ../Wonder-Mobile-V1.ipa Payload
          cd ..

          echo "=== IPA CONTENTS ==="
          unzip -l Wonder-Mobile-V1.ipa

          test -s Wonder-Mobile-V1.ipa

      - name: Upload Wonder IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V1-IPA
          path: Wonder-Mobile-V1.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Mobile-V1-Build-Report
          path: |
            project.yml
            Wonder/
          if-no-files-found: ignore
          retention-days: 7
