# setup
name: Wonder IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wonder iOS IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create source folders
        run: |
          mkdir -p Sources
          mkdir -p Assets.xcassets/AppIcon.appiconset

      - name: Create Wonder app
        shell: bash
        run: |
          cat > Sources/WonderApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct WonderApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }

          struct ContentView: View {
              @State private var showPreview = false

              var body: some View {
                  ZStack {
                      LinearGradient(
                          colors: [
                              Color(red: 0.12, green: 0.04, blue: 0.27),
                              Color(red: 0.29, green: 0.08, blue: 0.48),
                              Color(red: 0.08, green: 0.03, blue: 0.20)
                          ],
                          startPoint: .topLeading,
                          endPoint: .bottomTrailing
                      )
                      .ignoresSafeArea()

                      if showPreview {
                          previewScreen
                      } else {
                          welcomeScreen
                      }
                  }
                  .preferredColorScheme(.dark)
              }

              var welcomeScreen: some View {
                  VStack(spacing: 24) {
                      Spacer()

                      Text("Wonder")
                          .font(.system(size: 42, weight: .bold))
                          .foregroundStyle(.white)

                      Image(systemName: "sparkles")
                          .font(.system(size: 100))
                          .foregroundStyle(.yellow)
                          .padding(20)

                      Text("Welcome to Wonder")
                          .font(.system(size: 27, weight: .bold))
                          .foregroundStyle(.white)

                      Text("Your adventure starts here.")
                          .font(.system(size: 17))
                          .foregroundStyle(.white.opacity(0.75))

                      Spacer()

                      Button {
                          showPreview = true
                      } label: {
                          Text("Get Started!")
                              .font(.system(size: 19, weight: .bold))
                              .foregroundStyle(.white)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 17)
                              .background(Color.green.gradient)
                              .clipShape(RoundedRectangle(cornerRadius: 18))
                      }
                      .padding(.horizontal, 30)

                      Spacer()
                          .frame(height: 30)
                  }
                  .padding()
              }

              var previewScreen: some View {
                  VStack(spacing: 25) {
                      HStack {
                          Button {
                              showPreview = false
                          } label: {
                              Image(systemName: "chevron.left")
                                  .font(.title2.bold())
                                  .foregroundStyle(.white)
                          }

                          Spacer()

                          Text("Wonder")
                              .font(.title2.bold())
                              .foregroundStyle(.white)

                          Spacer()

                          Image(systemName: "sparkles")
                              .foregroundStyle(.yellow)
                      }

                      Spacer()

                      VStack(spacing: 18) {
                          RoundedRectangle(cornerRadius: 18)
                              .fill(
                                  LinearGradient(
                                      colors: [.green, .blue, .purple],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )
                              .frame(height: 220)
                              .overlay {
                                  VStack(spacing: 12) {
                                      Image(systemName: "sparkles")
                                          .font(.system(size: 65))
                                          .foregroundStyle(.white)

                                      Text("SUPER MARIO BROS. WONDER")
                                          .font(.system(size: 17, weight: .black))
                                          .foregroundStyle(.white)
                                  }
                                  .padding()
                              }

                          Text("Super Mario Bros. Wonder")
                              .font(.title2.bold())
                              .foregroundStyle(.white)

                          Text("Cartridge preview")
                              .foregroundStyle(.white.opacity(0.7))

                          Text("Visual demonstration only")
                              .font(.caption)
                              .foregroundStyle(.white.opacity(0.5))
                      }

                      Spacer()
                  }
                  .padding(25)
              }
          }
          SWIFT

      - name: Create Wonder flower icon generator
        shell: bash
        run: |
          cat > make-icon.swift <<'SWIFT'
          import AppKit
          import Foundation

          let size = 1024
          let image = NSImage(
              size: NSSize(width: size, height: size)
          )

          image.lockFocus()

          NSColor(
              red: 0.16,
              green: 0.04,
              blue: 0.34,
              alpha: 1
          ).setFill()

          NSBezierPath(
              roundedRect: NSRect(
                  x: 0,
                  y: 0,
                  width: size,
                  height: size
              ),
              xRadius: 180,
              yRadius: 180
          ).fill()

          let colors: [NSColor] = [
              .systemPink,
              .systemOrange,
              .systemYellow,
              .systemGreen,
              .systemCyan,
              .systemBlue,
              .systemPurple,
              .systemRed
          ]

          for index in 0..<8 {
              let petal = NSBezierPath(
                  ovalIn: NSRect(
                      x: 460,
                      y: 650,
                      width: 104,
                      height: 210
                  )
              )

              var transform = AffineTransform.identity
              transform.translate(x: 512, y: 512)
              transform.rotate(
                  byDegrees: CGFloat(index) * 45
              )
              transform.translate(x: -512, y: -512)

              petal.transform(using: transform)
              colors[index].setFill()
              petal.fill()
          }

          NSColor.systemYellow.setFill()
          NSBezierPath(
              ovalIn: NSRect(
                  x: 365,
                  y: 365,
                  width: 294,
                  height: 294
              )
          ).fill()

          NSColor.black.setFill()

          NSBezierPath(
              ovalIn: NSRect(
                  x: 435,
                  y: 490,
                  width: 28,
                  height: 42
              )
          ).fill()

          NSBezierPath(
              ovalIn: NSRect(
                  x: 561,
                  y: 490,
                  width: 28,
                  height: 42
              )
          ).fill()

          image.unlockFocus()

          guard
              let tiff = image.tiffRepresentation,
              let bitmap = NSBitmapImageRep(data: tiff),
              let png = bitmap.representation(
                  using: .png,
                  properties: [:]
              )
          else {
              fatalError("Could not generate icon")
          }

          try png.write(
              to: URL(
                  fileURLWithPath: CommandLine.arguments[1]
              )
          )
          SWIFT

      - name: Generate app icon
        run: |
          swift make-icon.swift \
            Assets.xcassets/AppIcon.appiconset/AppIcon.png

          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Create Xcode project configuration
        shell: bash
        run: |
          cat > project.yml <<'YAML'
          name: Wonder

          options:
            bundleIdPrefix: com.example
            deploymentTarget:
              iOS: "15.0"

          targets:
            Wonder:
              type: application
              platform: iOS

              sources:
                - Sources
                - Assets.xcassets

              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.wonder
                  PRODUCT_NAME: Wonder
                  TARGETED_DEVICE_FAMILY: "1,2"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
                  MARKETING_VERSION: "1.0"
                  CURRENT_PROJECT_VERSION: "1"
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: Wonder
                  INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
                  INFOPLIST_KEY_CFBundleVersion: "1"
                  INFOPLIST_KEY_CFBundlePackageType: APPL
                  CODE_SIGNING_ALLOWED: NO
          YAML

          xcodegen generate

      - name: Build Wonder
        run: |
          set -e

          xcodebuild \
            -project Wonder.xcodeproj \
            -scheme Wonder \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Wonder metadata
        shell: bash
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/Wonder.app"
          PLIST="$APP/Info.plist"

          test -d "$APP"
          test -f "$PLIST"

          echo "=== APP METADATA ==="
          plutil -p "$PLIST"

          echo "=== APP VERSION ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" "$PLIST"

          echo "=== BUILD NUMBER ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleVersion" "$PLIST"

          echo "=== BUNDLE IDENTIFIER ==="
          /usr/libexec/PlistBuddy \
            -c "Print :CFBundleIdentifier" "$PLIST"

      - name: Package Wonder IPA
        shell: bash
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/Wonder.app"

          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          cd ipa
          zip -qr ../Wonder.ipa Payload
          cd ..

          test -s Wonder.ipa

          echo "=== IPA CREATED ==="
          ls -lh Wonder.ipa

      - name: Upload Wonder IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Sample-Unsigned-IPA
          path: Wonder.ipa
          if-no-files-found: error
          retention-days: 7
