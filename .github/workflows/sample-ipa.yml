name: Wonder IPA Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Wonder iOS IPA
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Wonder app
        shell: bash
        run: |
          set -e

          mkdir -p Sources/Assets.xcassets/AppIcon.appiconset

          cat > Sources/WonderApp.swift <<'SWIFT'
          import SwiftUI

          @main
          struct WonderApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct ContentView: View {
              @State private var showPreview = false

              private let background = LinearGradient(
                  colors: [
                      Color(red: 0.10, green: 0.04, blue: 0.24),
                      Color(red: 0.23, green: 0.08, blue: 0.43),
                      Color(red: 0.08, green: 0.04, blue: 0.20)
                  ],
                  startPoint: .topLeading,
                  endPoint: .bottomTrailing
              )

              var body: some View {
                  ZStack {
                      background.ignoresSafeArea()

                      if showPreview {
                          previewScreen
                      } else {
                          welcomeScreen
                      }
                  }
                  .animation(.easeInOut(duration: 0.25), value: showPreview)
              }

              private var welcomeScreen: some View {
                  VStack(spacing: 22) {
                      Text("Wonder")
                          .font(.system(size: 38, weight: .bold, design: .rounded))
                          .foregroundColor(.white)

                      WonderFlower()
                          .frame(width: 190, height: 190)
                          .padding(.vertical, 12)

                      Text("Welcome to Wonder")
                          .font(.system(size: 27, weight: .bold, design: .rounded))
                          .foregroundColor(.white)

                      Text("Your adventure starts here.")
                          .font(.system(size: 16, weight: .medium))
                          .foregroundColor(.white.opacity(0.75))

                      Button {
                          showPreview = true
                      } label: {
                          Text("Get Started!")
                              .font(.system(size: 18, weight: .bold, design: .rounded))
                              .foregroundColor(.white)
                              .frame(maxWidth: .infinity)
                              .padding(.vertical, 17)
                              .background(
                                  LinearGradient(
                                      colors: [
                                          Color(red: 0.20, green: 0.78, blue: 0.42),
                                          Color(red: 0.08, green: 0.57, blue: 0.30)
                                      ],
                                      startPoint: .top,
                                      endPoint: .bottom
                                  )
                              )
                              .clipShape(RoundedRectangle(cornerRadius: 18))
                      }
                      .padding(.top, 18)
                  }
                  .padding(.horizontal, 30)
              }

              private var previewScreen: some View {
                  VStack(spacing: 24) {
                      HStack {
                          Button {
                              showPreview = false
                          } label: {
                              Label("Back", systemImage: "chevron.left")
                                  .foregroundColor(.white)
                          }

                          Spacer()

                          Text("Wonder")
                              .font(.system(size: 20, weight: .bold, design: .rounded))
                              .foregroundColor(.white)

                          Spacer()

                          Image(systemName: "sparkles")
                              .foregroundColor(.white.opacity(0.8))
                      }

                      Spacer()

                      ZStack {
                          RoundedRectangle(cornerRadius: 22)
                              .fill(
                                  LinearGradient(
                                      colors: [
                                          Color(red: 0.28, green: 0.12, blue: 0.55),
                                          Color(red: 0.08, green: 0.05, blue: 0.22)
                                      ],
                                      startPoint: .topLeading,
                                      endPoint: .bottomTrailing
                                  )
                              )

                          VStack(spacing: 18) {
                              WonderFlower()
                                  .frame(width: 125, height: 125)

                              Text("SUPER MARIO BROS.")
                                  .font(.system(size: 17, weight: .black, design: .rounded))
                                  .foregroundColor(.white)

                              Text("WONDER")
                                  .font(.system(size: 39, weight: .black, design: .rounded))
                                  .foregroundColor(
                                      Color(red: 1.0, green: 0.83, blue: 0.25)
                                  )

                              Text("GAME PREVIEW")
                                  .font(.system(size: 11, weight: .bold))
                                  .tracking(3)
                                  .foregroundColor(.white.opacity(0.7))
                          }
                          .padding(25)
                      }
                      .frame(height: 390)
                      .overlay(
                          RoundedRectangle(cornerRadius: 22)
                              .stroke(Color.white.opacity(0.2), lineWidth: 1)
                      )

                      Text("Super Mario Bros. Wonder")
                          .font(.system(size: 22, weight: .bold, design: .rounded))
                          .foregroundColor(.white)

                      Text("Visual cartridge preview")
                          .font(.system(size: 14))
                          .foregroundColor(.white.opacity(0.7))

                      Spacer()
                  }
                  .padding(25)
              }
          }

          struct WonderFlower: View {
              private let petalColors: [Color] = [
                  Color(red: 0.92, green: 0.25, blue: 0.72),
                  Color(red: 0.42, green: 0.37, blue: 0.98),
                  Color(red: 0.20, green: 0.62, blue: 0.98),
                  Color(red: 0.82, green: 0.32, blue: 0.83),
                  Color(red: 0.96, green: 0.42, blue: 0.65),
                  Color(red: 0.36, green: 0.48, blue: 0.98),
                  Color(red: 0.70, green: 0.34, blue: 0.92),
                  Color(red: 0.98, green: 0.34, blue: 0.53)
              ]

              var body: some View {
                  ZStack {
                      ForEach(0..<8, id: \.self) { index in
                          Ellipse()
                              .fill(
                                  LinearGradient(
                                      colors: [
                                          petalColors[index],
                                          petalColors[index].opacity(0.72)
                                      ],
                                      startPoint: .top,
                                      endPoint: .bottom
                                  )
                              )
                              .frame(width: 55, height: 91)
                              .offset(y: -43)
                              .rotationEffect(.degrees(Double(index) * 45))
                      }

                      Circle()
                          .fill(
                              LinearGradient(
                                  colors: [
                                      Color(red: 1.0, green: 0.91, blue: 0.36),
                                      Color(red: 1.0, green: 0.69, blue: 0.16)
                                  ],
                                  startPoint: .topLeading,
                                  endPoint: .bottomTrailing
                              )
                          )
                          .frame(width: 83, height: 83)

                      HStack(spacing: 17) {
                          Capsule()
                              .fill(Color.black)
                              .frame(width: 8, height: 19)

                          Capsule()
                              .fill(Color.black)
                              .frame(width: 8, height: 19)
                      }
                      .offset(y: -5)

                      Ellipse()
                          .fill(Color.black)
                          .frame(width: 23, height: 9)
                          .offset(y: 20)
                  }
                  .shadow(color: .black.opacity(0.22), radius: 12, y: 7)
              }
          }
          SWIFT

      - name: Create Wonder Flower icon
        shell: bash
        run: |
          set -e

          cat > make-icon.swift <<'SWIFT'
          import AppKit

          let size = 1024
          let image = NSImage(size: NSSize(width: size, height: size))

          image.lockFocus()

          guard NSGraphicsContext.current != nil else {
              fatalError("Graphics context unavailable")
          }

          NSColor(
              calibratedRed: 0.10,
              green: 0.04,
              blue: 0.24,
              alpha: 1
          ).setFill()

          NSBezierPath(
              rect: NSRect(x: 0, y: 0, width: size, height: size)
          ).fill()

          let colors: [NSColor] = [
              NSColor(calibratedRed: 0.92, green: 0.25, blue: 0.72, alpha: 1),
              NSColor(calibratedRed: 0.42, green: 0.37, blue: 0.98, alpha: 1),
              NSColor(calibratedRed: 0.20, green: 0.62, blue: 0.98, alpha: 1),
              NSColor(calibratedRed: 0.82, green: 0.32, blue: 0.83, alpha: 1),
              NSColor(calibratedRed: 0.96, green: 0.42, blue: 0.65, alpha: 1),
              NSColor(calibratedRed: 0.36, green: 0.48, blue: 0.98, alpha: 1),
              NSColor(calibratedRed: 0.70, green: 0.34, blue: 0.92, alpha: 1),
              NSColor(calibratedRed: 0.98, green: 0.34, blue: 0.53, alpha: 1)
          ]

          for index in 0..<8 {
              let petal = NSBezierPath(
                  ovalIn: NSRect(
                      x: 405,
                      y: 115,
                      width: 214,
                      height: 420
                  )
              )

              var transform = AffineTransform.identity
              transform.translate(x: 512, y: 512)
              transform.rotate(byDegrees: CGFloat(index) * 45)
              transform.translate(x: -512, y: -512)

              petal.transform(using: transform)

              colors[index].setFill()
              petal.fill()
          }

          NSColor(
              calibratedRed: 1.0,
              green: 0.83,
              blue: 0.25,
              alpha: 1
          ).setFill()

          NSBezierPath(
              ovalIn: NSRect(x: 342, y: 342, width: 340, height: 340)
          ).fill()

          NSColor.black.setFill()

          NSBezierPath(
              ovalIn: NSRect(x: 435, y: 455, width: 37, height: 75)
          ).fill()

          NSBezierPath(
              ovalIn: NSRect(x: 552, y: 455, width: 37, height: 75)
          ).fill()

          NSBezierPath(
              ovalIn: NSRect(x: 469, y: 380, width: 86, height: 37)
          ).fill()

          image.unlockFocus()

          guard let tiff = image.tiffRepresentation,
                let bitmap = NSBitmapImageRep(data: tiff),
                let png = bitmap.representation(
                    using: .png,
                    properties: [:]
                ) else {
              fatalError("Could not create PNG icon")
          }

          try png.write(
              to: URL(fileURLWithPath: "Sources/Assets.xcassets/AppIcon.appiconset/AppIcon.png")
          )

          print("Wonder icon generated successfully")
          SWIFT

          swift make-icon.swift

          cat > Sources/Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

      - name: Create Xcode project
        shell: bash
        run: |
          cat > project.yml <<'YAML'
          name: Wonder

          options:
            bundleIdPrefix: com.example

          targets:
            Wonder:
              type: application
              platform: iOS
              deploymentTarget: "15.0"
              sources:
                - Sources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.example.wonder
                  PRODUCT_NAME: Wonder
                  ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                  INFOPLIST_KEY_CFBundleDisplayName: Wonder
                  GENERATE_INFOPLIST_FILE: YES
                  SWIFT_VERSION: "5.0"
                  TARGETED_DEVICE_FAMILY: "1,2"
          YAML

          xcodegen generate

      - name: Build Wonder app
        shell: bash
        run: |
          set -e

          xcodebuild \
            -project Wonder.xcodeproj \
            -scheme Wonder \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned Wonder IPA
        shell: bash
        run: |
          set -e

          APP="build/Build/Products/Release-iphoneos/Wonder.app"

          test -d "$APP"

          mkdir -p Payload
          cp -R "$APP" Payload/

          ditto -c -k --sequesterRsrc --keepParent \
            Payload Wonder.ipa

          test -s Wonder.ipa

          echo "IPA created:"
          ls -lh Wonder.ipa

      - name: Upload Wonder IPA
        uses: actions/upload-artifact@v4
        with:
          name: Wonder-Sample-Unsigned-IPA
          path: Wonder.ipa
          retention-days: 7
